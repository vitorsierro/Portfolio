# Rate-limit zones (http context — must sit outside any server block).
#
# The login endpoint is the one place an attacker can guess their way in:
# everything else is either public (blog) or already requires a token. bcrypt
# makes each attempt expensive server-side, but nothing stopped an attacker
# from firing thousands of them until now.
#
# nginx is the edge here, so $binary_remote_addr is the real client IP.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# 429 is clearer to a legitimate user (and to logs) than the default 503.
limit_req_status 429;
