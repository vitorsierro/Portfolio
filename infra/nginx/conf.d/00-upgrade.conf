# Upgrade de WebSocket, do jeito certo.
#
# `proxy_set_header Connection "upgrade"` fixo — como estava aqui — envia
# "Connection: upgrade" em TODA request, inclusive nas normais (HTML, JS, CSS,
# XHR), que não trazem cabeçalho Upgrade nenhum. O servidor Node do outro lado
# recebe um "Connection: upgrade" sem Upgrade correspondente, trata como
# tentativa de upgrade malformada, e a conexão morre no meio da resposta.
# Numa SPA o sintoma não parece de rede: a página simplesmente recarrega
# sozinha, de novo e de novo.
#
# Este map devolve "upgrade" só quando o cliente de fato pediu upgrade, e
# "close" no resto. É a forma canônica documentada pelo nginx.
#
# Precisa ficar em conf.d/ (incluído dentro de http{}) porque `map` não é
# válido dentro de server{} — por isso não está junto dos snippets.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
