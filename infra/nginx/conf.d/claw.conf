# OpenClaw Control UI / WebChat — also unauthenticated on its own, and it can
# execute commands and reach your connected accounts, so the forward-auth gate
# is the only thing standing between the internet and that. Keep it on every
# location.
server {
    listen 443 ssl;
    http2 on;
    server_name claw.vitorsierro.com;

    # Mesmo certificado SAN de api./draw. — ver comentário em draw.conf.
    ssl_certificate     /etc/letsencrypt/live/api.vitorsierro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vitorsierro.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/forward-auth.conf;

    location / {
        auth_request /_auth_verify;

        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;

        proxy_pass http://openclaw:18789;
        proxy_http_version 1.1;

        # The Control UI streams over websockets.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived agent responses; capped so sockets don't outlive logout.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
