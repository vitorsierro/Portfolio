# Dashboard do Hermes, servido em chat.vitorsierro.com. Ele não tem
# autenticação própria aqui, e executa comandos e alcança as contas conectadas,
# então o forward-auth é a única coisa entre a internet e isso. Mantenha o
# auth_request em toda location.
server {
    listen 443 ssl;
    http2 on;
    server_name chat.vitorsierro.com;

    # Mesmo certificado SAN de api./draw. — ver comentário em draw.conf.
    ssl_certificate     /etc/letsencrypt/live/api.vitorsierro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vitorsierro.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/forward-auth.conf;

    location / {
        auth_request /_auth_verify;

        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;

        # O dashboard (9119), não o gateway (8642): a interface web é o
        # dashboard. O gateway fica só na rede interna.
        proxy_pass http://hermes:9119;
        proxy_http_version 1.1;

        # O dashboard streama as respostas do agente por websocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived agent responses; capped so sockets don't outlive logout.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
