# Excalidraw — no authentication of its own, so every request is gated by the
# forward-auth subrequest to the API.
server {
    listen 443 ssl;
    http2 on;
    server_name draw.vitorsierro.com;

    # Um único certificado cobre api./draw./claw. (SAN). O certbot guarda tudo
    # sob o nome do PRIMEIRO domínio pedido, então o caminho é o de api.* —
    # apontar para live/draw.*/ procuraria uma pasta que não existe e o nginx
    # não subiria.
    ssl_certificate     /etc/letsencrypt/live/api.vitorsierro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vitorsierro.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;
    include /etc/nginx/snippets/forward-auth.conf;

    # Collaboration websocket (socket.io).
    location /socket.io/ {
        auth_request /_auth_verify;

        proxy_pass http://excalidraw-room:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        # auth_request runs once, at the Upgrade handshake — an open socket
        # would otherwise outlive a logout indefinitely. Capping the read
        # timeout forces periodic reconnects, which re-check auth.
        proxy_read_timeout 1h;
    }

    location / {
        auth_request /_auth_verify;

        # Surface who passed the gate to the upstream (single admin today,
        # but it keeps the tools from having to guess).
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;

        proxy_pass http://excalidraw:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
