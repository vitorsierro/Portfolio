# Public API. No auth_request here — the API owns its own authentication
# (bearer JWT for CMS mutations, cookie for /auth/*), and gating it at the
# proxy would break the public blog endpoints and the login flow itself.
server {
    listen 443 ssl;
    http2 on;
    server_name api.vitorsierro.com;

    ssl_certificate     /etc/letsencrypt/live/api.vitorsierro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vitorsierro.com/privkey.pem;
    include /etc/nginx/snippets/tls.conf;

    location / {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
