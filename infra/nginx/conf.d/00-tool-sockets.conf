resolver 127.0.0.11 valid=5s ipv6=off;

# Resolução dinâmica permite validar o nginx antes de criar o serviço novo.
upstream tool_socket_gateway {
    zone tool_socket_gateway 64k;
    server tool-sockets:8080 resolve;
}
upstream hermes_dashboard { server hermes:9120; }
upstream draw_collaboration { server excalidraw-room:8080; }

map $http_upgrade $hermes_backend {
    '' hermes_dashboard;
    default tool_socket_gateway;
}
map $http_upgrade $draw_collaboration_backend {
    '' draw_collaboration;
    default tool_socket_gateway;
}
