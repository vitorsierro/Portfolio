# nginx de desenvolvimento: mesmo forward-auth da produção, sem TLS.
#
# Diferenças em relação a conf.d/ (produção):
#   - separa as ferramentas por PORTA (8081/8082) em vez de subdomínio, para
#     não exigir mexer no hosts do Windows;
#   - o upstream de auth é a API rodando no HOST (yarn dev), não um container.
#
# Cookies ignoram porta: o `admin_session` setado por localhost:3001 é enviado
# para localhost:8081 e :8082. É isso que faz o login único funcionar aqui.

map $http_sec_fetch_mode $is_navigation {
    default 0;
    navigate 1;
}

# Mesmo map de conf.d/00-upgrade.conf — ver o comentário longo lá. Resumo:
# mandar "Connection: upgrade" em request que não pediu upgrade faz o Node
# derrubar a conexão, e a SPA fica recarregando sozinha.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# host.docker.internal resolve para IPv4 E IPv6, mas só o IPv4 é roteável
# daqui. Sem `ipv6=off` o nginx alterna entre os dois e metade das requisições
# morre com "Network unreachable" (o HTML carrega, os assets falham com 500).
# Usar variável no proxy_pass é o que força a resolução via este resolver.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8081;
    server_name localhost;

    location = /_auth_verify {
        internal;
        set $auth_upstream host.docker.internal;
        proxy_pass http://$auth_upstream:3001/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # Ver comentário em snippets/forward-auth.conf: sem isso o Origin da
        # ferramenta chega aqui, o CORS da API rejeita e o gate devolve 500.
        proxy_set_header Origin "";
    }

    error_page 401 = @auth_fallback;

    location @auth_fallback {
        if ($is_navigation) {
            return 302 http://localhost:3000/admin/login?next=http://localhost:8081$request_uri;
        }
        return 401;
    }

    location / {
        auth_request /_auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;

        proxy_pass http://excalidraw:80;
        proxy_set_header Host $host;
    }
}

server {
    listen 8082;
    server_name localhost;

    location = /_auth_verify {
        internal;
        set $auth_upstream host.docker.internal;
        proxy_pass http://$auth_upstream:3001/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        # Ver comentário em snippets/forward-auth.conf: sem isso o Origin da
        # ferramenta chega aqui, o CORS da API rejeita e o gate devolve 500.
        proxy_set_header Origin "";
    }

    error_page 401 = @auth_fallback;

    location @auth_fallback {
        if ($is_navigation) {
            return 302 http://localhost:3000/admin/login?next=http://localhost:8082$request_uri;
        }
        return 401;
    }

    location / {
        auth_request /_auth_verify;
        auth_request_set $auth_user $upstream_http_x_auth_user;
        proxy_set_header X-Auth-User $auth_user;

        # O dashboard do Hermes (9119), não o gateway (8642).
        proxy_pass http://hermes:9119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
