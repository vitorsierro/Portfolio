# Shared forward-auth wiring for the gated tool subdomains.
# Include inside a server{} block, then put `auth_request /_auth_verify;` in
# the locations you want protected.

# Subrequest target. Points at the INTERNAL api service, not the public
# api.vitorsierro.com — a public round-trip per request would be wasteful and
# would break if DNS/TLS hiccups.
location = /_auth_verify {
    internal;
    proxy_pass http://api:3001/auth/verify;

    # A subrequest carries no body; nginx requires these to be cleared.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    # The session cookie is the whole point of the check.
    proxy_set_header Cookie $http_cookie;

    # Strip Origin. nginx forwards the original request's headers into the
    # subrequest, and the browser sets Origin on cross-origin subresource
    # requests — so the tool's own origin would arrive here. The API's CORS
    # allowlist (correctly) excludes the tool subdomains, so it would reject
    # the subrequest, nginx would see an unexpected status, and the gate would
    # 500 instead of allowing a perfectly valid session. This is a
    # server-to-server call; it has no business carrying a browser Origin.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
}

# On 401 from the subrequest: send browsers to the login page, but give
# XHR/fetch/asset requests a plain 401. Redirecting those would hand JS an
# HTML login page where it expects JSON.
error_page 401 = @auth_fallback;

location @auth_fallback {
    if ($http_sec_fetch_mode = "navigate") {
        return 302 https://vitorsierro.com/admin/login?next=$scheme://$host$request_uri;
    }
    return 401;
}
