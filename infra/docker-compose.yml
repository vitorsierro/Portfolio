# Hostinger KVM2 stack: API + self-hosted tools behind one login.
#
# Only nginx publishes ports. Every other service is reachable solely on the
# internal Docker network, so the tools can't be hit directly, bypassing the
# forward-auth check.
#
# NETWORK SEGMENTATION — one network per zone, nginx bridging them.
# A single shared network would let OpenClaw talk straight to api:3001,
# which matters because OpenClaw is the one service here that runs commands
# and processes untrusted input (messages, web pages). From there it could
# hammer /auth/login with no rate limit, since limit_req lives in nginx and
# a direct call skips the proxy entirely. Each service only needs to be
# reachable BY nginx — none of them need to reach each other.
#
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/prod.db
      WEB_ORIGIN: ${WEB_ORIGIN}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_SAMPLE_POSTS: "false"
    volumes:
      - api_data:/data
    networks: [backend]

  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    networks: [draw]

  # Collaboration backend (socket.io). NOTE: the public excalidraw image bakes
  # its WS server URL in at build time, so live collaboration only engages if
  # you build the frontend yourself with VITE_APP_WS_SERVER_URL set. Solo
  # drawing works regardless.
  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    restart: unless-stopped
    networks: [draw]

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    # Sem estas flags o gateway sai em loop pedindo `openclaw setup`
    # (interativo, não roda em container).
    #
    # --auth token: o OpenClaw SE RECUSA a escutar fora do loopback sem
    #   autenticação, e em container o bind é sempre 0.0.0.0. Aqui o token é
    #   defesa em profundidade: o nginx já barra tudo antes, mas se alguém
    #   alcançar a porta interna, ainda precisa do token.
    #   Ele vem de OPENCLAW_GATEWAY_TOKEN em infra/openclaw.env.
    #
    # Existe um modo `trusted-proxy`, que delegaria a auth ao nginx e daria
    # login único de verdade (sem colar token na Control UI). Exige arquivo de
    # config com trustedProxies/userHeader/allowUsers — ver infra/README.md.
    #
    # ATENÇÃO no primeiro deploy: servido pelo proxy, a origem deixa de ser a
    # do próprio gateway e ele fecha o WebSocket com `origin not allowed` —
    # a Control UI fica presa no login mesmo com o token correto. É preciso
    # rodar uma vez (o valor fica no volume openclaw_data):
    #   echo '{ gateway: { controlUi: { allowedOrigins: ["https://claw.vitorsierro.com"] } } }' \
    #     | docker compose exec -T openclaw node openclaw.mjs config patch --stdin
    command:
      - node
      - openclaw.mjs
      - gateway
      - --allow-unconfigured
      - --auth
      - token
      - --port
      - "18789"
    env_file:
      - path: ./openclaw.env
        required: false
    volumes:
      # /home/node, NÃO /root: a imagem roda como uid 1000 (node), então um
      # volume em /root fica sem permissão de leitura — a config iria para
      # /home/node/.openclaw, fora do volume, e sumiria a cada recreate
      # (credenciais de provedor, canais conectados, memória do agente).
      - openclaw_data:/home/node/.openclaw
    # Rede própria: o OpenClaw não alcança api:3001 nem o Excalidraw. Ele só
    # precisa ser alcançado pelo nginx. Mantém saída para a internet (as APIs
    # de IA), que é o que ele legitimamente precisa.
    networks: [claw]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Periodic reload so renewed certs are picked up without a restart.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # nginx resolves proxy_pass hostnames at startup, so every upstream it
    # references must exist or it refuses to boot — excalidraw-room included.
    depends_on: [api, excalidraw, excalidraw-room, openclaw]
    # O nginx é a única peça que participa de todas as zonas — é ele quem
    # faz a ponte, e sempre passando pelo gate.
    networks: [backend, draw, claw]

  # Renews certs twice a day; nginx reloads them via its own timer below.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

volumes:
  api_data:
  openclaw_data:
  certbot_conf:
  certbot_www:

networks:
  backend: # api
  draw: # excalidraw + sala de colaboração
  claw: # openclaw, isolado do resto
