# Hostinger KVM2 stack: API + self-hosted tools behind one login.
#
# Only nginx publishes ports. Every other service is reachable solely on the
# internal Docker network, so the tools can't be hit directly, bypassing the
# forward-auth check.
#
# NETWORK SEGMENTATION — one network per zone, nginx bridging them.
# A single shared network would let Hermes talk straight to api:3001, which
# matters because Hermes is the one service here that runs commands and
# processes untrusted input (messages, web pages). From there it could hammer
# /auth/login with no rate limit, since limit_req lives in nginx and a direct
# call skips the proxy entirely. Each service only needs to be reachable BY
# nginx — none of them need to reach each other.
#
# Run from the repo root:  docker compose -f infra/docker-compose.yml up -d

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: file:/data/prod.db
      WEB_ORIGIN: ${WEB_ORIGIN}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEED_SAMPLE_POSTS: "false"
    volumes:
      - api_data:/data
    networks: [backend]

  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    networks: [draw]

  # Collaboration backend (socket.io). NOTE: the public excalidraw image bakes
  # its WS server URL in at build time, so live collaboration only engages if
  # you build the frontend yourself with VITE_APP_WS_SERVER_URL set. Solo
  # drawing works regardless.
  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    restart: unless-stopped
    networks: [draw]

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    # `gateway run` é o modo servidor — o entrypoint da imagem é o próprio
    # binário. O `setup` é interativo e não roda aqui: a configuração inicial é
    # feita uma vez à mão, ver infra/README.md.
    command: [gateway, run]
    environment:
      # O dashboard é a interface web, e é ele que o hermes-proxy publica para
      # o nginx. Sem HERMES_DASHBOARD o serviço sobe só com a API.
      HERMES_DASHBOARD: "1"
      # 127.0.0.1, NÃO 0.0.0.0: o Hermes se recusa a escutar fora do loopback
      # sem um provedor de auth próprio (login separado do /admin). Bindando
      # em loopback esse gate nunca engata, e quem alcança a porta mesmo assim
      # é só o hermes-proxy — sidecar na MESMA network namespace (ver abaixo).
      # É o equivalente containerizado do túnel SSH que a doc do Hermes sugere
      # para "auth-free dashboard".
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
    env_file:
      # GATEWAY_AUTH_TOKEN vive aqui: o Hermes SE RECUSA a escutar fora do
      # loopback sem autenticação, e em container o bind é sempre 0.0.0.0.
      - path: ./hermes.env
        required: false
    volumes:
      # /opt/data é o caminho de dados da imagem oficial. Tudo que precisa
      # sobreviver a um recreate mora aqui: config.yaml, o .env com as chaves
      # de provedor, auth.json, sessions/.
      - hermes_data:/opt/data
    # Rede própria: o Hermes não alcança api:3001 nem o Excalidraw. Ele só
    # precisa ser alcançado pelo hermes-proxy. Mantém saída para a internet
    # (as APIs de IA), que é o que ele legitimamente precisa.
    networks: [hermes]

  # Sidecar que faz o dashboard do Hermes enxergar toda conexão como loopback,
  # eliminando o segundo login (além do /admin). Sem isto o dashboard exige
  # HERMES_DASHBOARD_BASIC_AUTH_* — ver o histórico em infra/hermes.env.example.
  #
  # `network_mode: "service:hermes"` faz este container compartilhar a MESMA
  # network namespace do hermes (mesma interface, mesmo IP na rede `hermes`,
  # mesmo loopback). Por isso ele NÃO declara `networks:` própria — herda a
  # do hermes — e alcança 127.0.0.1:9119 de dentro dessa namespace, exatamente
  # como um processo rodando ao lado faria.
  #
  # Segurança disto depende inteiramente da rede `hermes` continuar isolada:
  # quem alcançar a porta 9120 nela passa direto pelo Hermes sem senha alguma.
  # Hoje só o nginx está nessa rede — não adicione mais nada a ela sem revisar
  # este comentário.
  hermes-proxy:
    image: alpine:3.20
    restart: unless-stopped
    command: sh -c "apk add --no-cache socat && exec socat TCP-LISTEN:9120,fork,reuseaddr TCP:127.0.0.1:9119"
    network_mode: "service:hermes"
    depends_on: [hermes]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Periodic reload so renewed certs are picked up without a restart.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # nginx resolves proxy_pass hostnames at startup, so every upstream it
    # references must exist or it refuses to boot — excalidraw-room included.
    # hermes-proxy shares hermes's own hostname/IP (network_mode: service:),
    # so listing "hermes" here already covers it — no separate entry exists.
    depends_on: [api, excalidraw, excalidraw-room, hermes, hermes-proxy]
    # O nginx é a única peça que participa de todas as zonas — é ele quem
    # faz a ponte, e sempre passando pelo gate.
    networks: [backend, draw, hermes]

  # Renews certs twice a day; nginx reloads them via its own timer below.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

volumes:
  api_data:
  hermes_data:
  certbot_conf:
  certbot_www:

networks:
  backend: # api
  draw: # excalidraw + sala de colaboração
  hermes: # hermes, isolado do resto
