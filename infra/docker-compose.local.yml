# Só as ferramentas, para rodar no localhost durante o desenvolvimento.
# A API e o site continuam no `yarn dev` — este arquivo não os sobe.
#
#   docker compose -f infra/docker-compose.local.yml up -d
#
# ATENÇÃO: aqui NÃO há nginx, logo NÃO há barreira de login. As portas ficam
# abertas em localhost. Isso serve para desenvolver a integração do /admin;
# o gate de autenticação só é exercitado com o docker-compose.yml completo.

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    ports:
      - "8080:80"

  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    restart: unless-stopped
    # --allow-unconfigured: sem isso o gateway sai em loop exigindo
    #   `openclaw setup` (que é interativo e não roda em container).
    # Não passe --bind: em container o OpenClaw já detecta o ambiente e usa
    #   bind=auto (0.0.0.0). Forçar `lan` faz ele recusar a subir.
    # --auth token: NÃO é opcional. O OpenClaw se recusa a escutar fora do
    #   loopback sem autenticação, e em container o bind é sempre 0.0.0.0.
    #   O token vem de OPENCLAW_GATEWAY_TOKEN (infra/openclaw.env).
    command:
      - node
      - openclaw.mjs
      - gateway
      - --allow-unconfigured
      - --auth
      - token
      - --port
      - "18789"
    ports:
      # 127.0.0.1 no host: sem isso a porta ficaria aberta para toda a LAN, e
      # o OpenClaw executa comandos na máquina.
      - "127.0.0.1:18789:18789"
    env_file:
      - path: ./openclaw.env
        required: false
    volumes:
      - openclaw_data:/root/.openclaw

volumes:
  openclaw_data:
