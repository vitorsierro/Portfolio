# Só as ferramentas, para rodar no localhost durante o desenvolvimento.
# A API e o site continuam no `yarn dev` — este arquivo não os sobe.
#
#   docker compose -f infra/docker-compose.local.yml up -d
#
# ATENÇÃO: aqui NÃO há nginx, logo NÃO há barreira de login. As portas ficam
# abertas em localhost. Isso serve para desenvolver a integração do /admin;
# o gate de autenticação só é exercitado com o docker-compose.yml completo.

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    ports:
      - "8080:80"

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    # `gateway run` é o modo servidor. O `setup` é interativo e não roda em
    # container — a configuração inicial é feita à mão, ver infra/README.md.
    # GATEWAY_AUTH_TOKEN (em infra/hermes.env) não é opcional: o Hermes se
    # recusa a escutar fora do loopback sem autenticação, e em container o bind
    # é sempre 0.0.0.0.
    #
    # SEM o sidecar hermes-proxy que docker-compose.yml/dev.yml usam — aqui a
    # porta já publica direto no host, então o bind continua não-loopback e o
    # dashboard continua exigindo HERMES_DASHBOARD_BASIC_AUTH_* (login próprio).
    # Isso é aceitável só porque este arquivo já documenta acima que não há
    # barreira de login nenhuma — não é o padrão dos outros dois compose.
    command: [gateway, run]
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
    ports:
      # 127.0.0.1 no host: sem isso as portas ficariam abertas para toda a LAN,
      # e o Hermes executa comandos na máquina.
      - "127.0.0.1:9119:9119"
      - "127.0.0.1:8642:8642"
    env_file:
      - path: ./hermes.env
        required: false
    volumes:
      - hermes_data:/opt/data

volumes:
  hermes_data:

