# Ensaio local do forward-auth: as ferramentas ficam ATRÁS do nginx, com a
# mesma barreira de login da produção — só que sem TLS e separadas por porta.
#
# Pré-requisito: `yarn dev` rodando (a API em :3001 é quem valida a sessão).
#
#   docker compose -f infra/docker-compose.dev.yml up -d
#
#   http://localhost:8081  → Excalidraw (exige login)
#   http://localhost:8082  → Hermes     (exige login)
#
# Diferente do docker-compose.local.yml, aqui as ferramentas NÃO publicam
# portas: só o nginx é alcançável, então não há como driblar o gate.

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    restart: unless-stopped
    networks: [draw]

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    command: [gateway, run]
    environment:
      HERMES_DASHBOARD: "1"
      # 127.0.0.1 + hermes-proxy abaixo: mesmo mecanismo de docker-compose.yml,
      # para exercitar aqui o que vale na VPS. Ver o comentário lá.
      HERMES_DASHBOARD_HOST: "127.0.0.1"
      HERMES_DASHBOARD_PORT: "9119"
    env_file:
      - path: ./hermes.env
        required: false
    volumes:
      # /opt/data é o caminho de dados da imagem oficial. Ver docker-compose.yml.
      - hermes_data:/opt/data
    # Isolado: não alcança o Excalidraw nem a API. Espelha a segmentação de
    # produção — ver o comentário em docker-compose.yml.
    networks: [hermes]

  hermes-proxy:
    image: alpine:3.20
    restart: unless-stopped
    command: sh -c "apk add --no-cache socat && exec socat TCP-LISTEN:9120,fork,reuseaddr TCP:127.0.0.1:9119"
    network_mode: "service:hermes"
    depends_on: [hermes]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8082:8082"
    volumes:
      - ./nginx/dev:/etc/nginx/conf.d:ro
    depends_on: [excalidraw, hermes, hermes-proxy]
    networks: [draw, hermes]
    # Permite ao nginx alcançar a API do `yarn dev`, que roda no host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hermes_data:

networks:
  draw:
  hermes:
