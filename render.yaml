# Render Blueprint for the NestJS API (blog + CMS).
# Docs: https://render.com/docs/blueprint-spec
#
# The API uses SQLite, so it needs a persistent disk (paid plan) — the DB file
# lives on the mounted disk and survives deploys/restarts. Migrations run on
# every boot (no-op when already applied). The web app (Next.js) is deployed
# separately (e.g. Vercel) and points at this service's URL.
services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: starter # persistent disks require a paid plan
    branch: main
    rootDir: .
    buildCommand: yarn install && yarn workspace api prisma generate && yarn workspace api build
    startCommand: yarn workspace api prisma:deploy && node apps/api/dist/main.js
    healthCheckPath: /portfolio
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/prod.db
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: SEED_SAMPLE_POSTS
        value: "false"
      # Render generates strong random values for these on first deploy:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Fill these in the Render dashboard (sync:false = not stored in git):
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
